<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
<title id="title">Tahor — a calmer inbox, on your terms</title>
<desc id="desc">A self-hosted email assistant. Classify, organize, and review. Keep the decisions that matter.</desc>
<defs><radialGradient id="glow"><stop stop-color="#19534b"/><stop offset="1" stop-color="#0b1f1d"/></radialGradient><linearGradient id="line"><stop stop-color="#2bc7bb"/><stop offset="1" stop-color="#2bc7bb" stop-opacity="0"/></linearGradient></defs>
<rect width="1280" height="400" rx="20" fill="#0b1f1d"/>
<ellipse cx="1060" cy="130" rx="430" ry="340" fill="url(#glow)"/>
<g transform="translate(65 60) scale(.85)" fill="#2bc7bb"><path fill-rule="evenodd" d="M50,8 C50,8 18,54 18,68 A32,32 0 1 0 82,68 C82,54 50,8 50,8 Z M30,52 L50,66 L70,52 L70,59 L50,73 L30,59 Z"/></g>
<text x="166" y="122" font-family="Georgia,serif" font-size="64" fill="#e2eeec">Tahor</text>
<text x="350" y="119" font-family="Georgia,serif" font-size="27" fill="#8cb9af">טָהוֹר</text>
<text x="68" y="210" font-family="Georgia,serif" font-size="45" fill="#e2eeec">A calmer inbox. On your terms.</text>
<text x="70" y="259" font-family="Arial,sans-serif" font-size="21" fill="#a4bfb8">Classify the backlog. Keep the receipts. Review what matters.</text>
<rect x="70" y="299" width="470" height="1" fill="url(#line)"/>
<text x="70" y="334" font-family="Arial,sans-serif" font-size="15" letter-spacing="2" fill="#2bc7bb">SELF-HOSTED  ·  IMAP-NATIVE  ·  HUMAN-REVIEWED</text>
<g transform="translate(924 133) rotate(-9)" fill="none" stroke="#2bc7bb" stroke-width="2" opacity=".55"><rect width="224" height="144" rx="14"/><path d="M0 15L112 89 224 15M0 144L79 68M224 144L145 68"/><circle cx="206" cy="12" r="24" fill="#0b1f1d"/><path d="M194 12l8 8 16-18" stroke-width="3"/></g>
